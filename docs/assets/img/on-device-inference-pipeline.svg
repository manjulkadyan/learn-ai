<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">An on-device AI inference pipeline</title>
  <desc id="desc">A camera, microphone, or text input enters an Android app, is prepared, passes through a local model, and becomes a product action. The model was shipped earlier as an asset.</desc>
  <style>
    .ink { fill: #1f2937; font: 600 18px system-ui, sans-serif; }
    .small { fill: #4b5563; font: 14px system-ui, sans-serif; }
    .box { fill: #eef2ff; stroke: #3949ab; stroke-width: 3; }
    .phone { fill: #ecfeff; stroke: #00897b; stroke-width: 4; }
    .arrow { stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect width="1000" height="260" rx="24" fill="#fff"/>
  <text x="32" y="38" class="ink">One prediction inside a mobile feature</text>
  <rect x="32" y="90" width="145" height="85" rx="16" class="box"/>
  <text x="104" y="125" text-anchor="middle" class="ink">Input</text><text x="104" y="151" text-anchor="middle" class="small">camera / text / audio</text>
  <line x1="177" y1="132" x2="245" y2="132" class="arrow"/>
  <rect x="245" y="90" width="160" height="85" rx="16" class="box"/>
  <text x="325" y="125" text-anchor="middle" class="ink">Prepare</text><text x="325" y="151" text-anchor="middle" class="small">resize / tokenize</text>
  <line x1="405" y1="132" x2="473" y2="132" class="arrow"/>
  <rect x="473" y="68" width="190" height="128" rx="22" class="phone"/>
  <text x="568" y="112" text-anchor="middle" class="ink">On-device model</text><text x="568" y="139" text-anchor="middle" class="small">fixed parameters</text><text x="568" y="166" text-anchor="middle" class="small">no network required</text>
  <line x1="663" y1="132" x2="731" y2="132" class="arrow"/>
  <rect x="731" y="90" width="135" height="85" rx="16" class="box"/>
  <text x="798" y="125" text-anchor="middle" class="ink">Prediction</text><text x="798" y="151" text-anchor="middle" class="small">score / class</text>
  <line x1="866" y1="132" x2="935" y2="132" class="arrow"/>
  <text x="968" y="125" text-anchor="middle" class="ink">UI</text><text x="968" y="151" text-anchor="middle" class="small">action</text>
  <path d="M500 52 C500 18 635 18 635 52" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="568" y="25" text-anchor="middle" class="small">model asset shipped earlier</text>
</svg>
